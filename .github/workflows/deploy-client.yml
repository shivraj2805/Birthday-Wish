name: Deploy Birthday App (Client) to EC2

on:
  push:
    branches: ["master"]
    paths:
      - "client/**"
      - ".github/workflows/deploy-client.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      # ✅ Create .env for Vite build from GitHub Secrets (build-time)
      - name: Create client .env for build
        working-directory: client
        run: |
          cat > .env << 'EOL'
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          EOL

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build (Vite -> dist/)
        working-directory: client
        run: npm run build

      - name: Ensure rsync + ssh client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" 2>/dev/null >> ~/.ssh/known_hosts || true

      - name: Upload dist to EC2
        run: |
          rsync -avz --delete ./client/dist/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/dist/"

      - name: Start/Restart app with PM2 (serve dist on :3000)
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e
            cd "${{ secrets.EC2_DEPLOY_PATH }}"

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm i -g pm2
            fi
            if ! command -v serve >/dev/null 2>&1; then
              sudo npm i -g serve
            fi

            if pm2 list | grep -q "bdayapp"; then
              pm2 restart bdayapp
            else
              pm2 start serve --name "bdayapp" -- -s dist -l 3000
            fi

            pm2 save
            sudo systemctl reload nginx 2>/dev/null || true
          EOF