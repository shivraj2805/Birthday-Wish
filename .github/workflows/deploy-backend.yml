name: Deploy backend to EC2

on:
  push:
    branches: ["master"]
    paths:
      - "server/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy_server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies (CI check)
        working-directory: server
        run: npm ci

      - name: Install rsync + ssh client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" 2>/dev/null >> ~/.ssh/known_hosts || true

      - name: Upload server to EC2
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ secrets.EC2_PORT }}" \
            server/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/server/

      - name: Create server .env from GitHub Secrets
        run: |
          ssh -p ${{ secrets.EC2_PORT }} ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd "${{ secrets.APP_DIR }}/server"

            cat > .env << EOL
            PORT=${{ secrets.PORT }}
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            EOL

            chmod 600 .env
          EOF

      - name: Restart server with PM2
        run: |
          ssh -p ${{ secrets.EC2_PORT }} ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd "${{ secrets.APP_DIR }}/server"

            # Install production dependencies on server
            npm ci --omit=dev || npm install --omit=dev

            # Ensure pm2 exists
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm i -g pm2
            fi

            # Start or restart
            if pm2 describe server >/dev/null 2>&1; then
              pm2 restart server
            else
              pm2 start index.js --name server
            fi

            pm2 save
          EOF