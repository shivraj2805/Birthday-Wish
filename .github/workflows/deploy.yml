name: Deploy Birthday App to EC2

on:
  push:
    branches: ["master"] 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite -> dist/)
        run: npm run build

      - name: Ensure rsync + ssh client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rsync openssh-client

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload dist to EC2
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          rsync -avz --delete ./dist/ \
            "$EC2_USER@$EC2_HOST:$EC2_DEPLOY_PATH/dist/"

      - name: Start/Restart app with PM2 (serve dist on :3000)
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" << EOF
            set -e
            cd "$EC2_DEPLOY_PATH"

            # Ensure Node tooling exists on EC2 (pm2 + serve)
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm i -g pm2
            fi
            if ! command -v serve >/dev/null 2>&1; then
              sudo npm i -g serve
            fi

            # Start or restart static server
            if pm2 list | grep -q "bdayapp"; then
              pm2 restart bdayapp
            else
              pm2 start serve --name "bdayapp" -- -s dist -l 3000
            fi

            pm2 save

            # Reload nginx (ignore if not installed)
            sudo systemctl reload nginx 2>/dev/null || true
          EOF